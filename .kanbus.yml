  name: Discovery
  category: To do
  color: null
  collapsed: false
- key: in_progress
  name: In Progress
  category: In progress
  color: null
  collapsed: false
- key: blocked
  name: Blocked
  category: In progress
  color: null
  collapsed: true
- key: closed
  name: Done
  category: Done
  color: null
  collapsed: true
- key: proposed
  name: Proposed
  category: Flywheel
  color: null
  collapsed: false
- key: decomposed
  name: Decomposed
  category: Flywheel
  color: null
  collapsed: false
- key: gold-authored
  name: Gold authored
  category: Flywheel
  color: null
  collapsed: false
- key: verified
  name: Verified
  category: Flywheel
  color: null
  collapsed: false
- key: labeling
  name: Labeling
  category: Annotation
  color: null
  collapsed: false
- key: awaiting-review
  name: Awaiting review
  category: Annotation
  color: null
