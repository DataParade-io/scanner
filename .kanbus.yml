- key: rejected
  name: Rejected
  category: Annotation
  color: null
  collapsed: true
categories:
- name: To do
  color: grey
- name: In progress
  color: blue
- name: Done
  color: green
- name: Flywheel
  color: yellow
- name: Annotation
  color: magenta
sort_order: {}
type_colors:
  bug: red
  chore: green
  epic: magenta
  event: bright_blue
  initiative: bright_blue
  story: yellow
  sub-task: bright_cyan
  task: blue
  finding: yellow
  annotation: magenta
beads_compatibility: false
wiki_directory: null
ai: null
jira: null
snyk: null
realtime:
  transport: auto
  broker: auto
  autostart: true
  keepalive: false
  uds_socket_path: null
  mqtt_custom_authorizer_name: null
  mqtt_api_token: null
  topics:
    project_events: projects/{project}/events
overlay:
  enabled: true
  ttl_s: 86400
hooks:
  enabled: true
  run_in_beads_mode: true
  default_timeout_ms: 5000
  before:
    issue.update:
    - id: flywheel-artifact-gate
      command:
      - python3
      - ./hooks/flywheel-artifact-gate.py
      timeout_ms: 5000
  after:
    issue.create:
    - id: flywheel-scaffold
      command:
      - python3
      - ./hooks/flywheel-scaffold.py
      timeout_ms: 15000
github_security: null
