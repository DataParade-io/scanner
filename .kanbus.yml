project_directory: project
virtual_projects: {}
new_issue_project: null
ignore_paths: []
console_port: 4256
project_key: KDATAP
project_management_template: null
hierarchy:
- initiative
- epic
- task
- sub-task
types:
- bug
- story
- chore
- finding
- annotation
workflows:
  default:
    backlog:
    - open
    - closed
    blocked:
    - in_progress
    - closed
    closed:
    - open
    in_progress:
    - open
    - blocked
    - closed
    open:
    - in_progress
    - closed
    - backlog
  epic:
    closed:
    - open
    in_progress:
    - open
    - closed
    open:
    - in_progress
    - closed
  finding:
    open:
    - proposed
    - closed
    proposed:
    - decomposed
    - closed
    decomposed:
    - gold-authored
    - proposed
    gold-authored:
    - verified
    - decomposed
    verified:
    - closed
    - gold-authored
    closed:
    - verified
    - open
  annotation:
    open:
    - labeling
    - closed
    labeling:
    - awaiting-review
    - closed
    awaiting-review:
    - accepted
    - labeling
    - rejected
    accepted:
    - awaiting-review
    - closed
    rejected:
    - labeling
    - closed
    closed:
    - open
transition_labels:
  default:
    backlog:
      closed: Drop
      open: Start discovery
    blocked:
      closed: Drop
      in_progress: Unblock
    closed:
      open: Reopen
    in_progress:
      blocked: Block
      closed: Complete
      open: Pause
    open:
      backlog: Back to backlog
      closed: Drop
      in_progress: Start work
  epic:
    closed:
      open: Reopen
    in_progress:
      closed: Complete
      open: Pause
    open:
      closed: Complete
      in_progress: Start
  finding:
    open:
      proposed: Start flywheel
      closed: Drop
    proposed:
      decomposed: Decompose by eval layer
      closed: Drop
    decomposed:
      gold-authored: Author gold
      proposed: Revise proposal
    gold-authored:
      verified: Eval matches gold
      decomposed: Revise decomposition
    verified:
      closed: Complete
      gold-authored: Re-label
    closed:
      verified: Reopen
      open: Reset
  annotation:
    open:
      labeling: Start labeling
      closed: Drop
    labeling:
      awaiting-review: Send to human review
      closed: Drop
    awaiting-review:
      accepted: Accept gold
      labeling: More labeling
      rejected: Reject
    accepted:
      awaiting-review: Re-review repo
      closed: Complete
    rejected:
      labeling: Relabel
      closed: Drop
    closed:
      open: Reopen
initial_status: open
priorities:
  0:
    name: critical
    color: red
  1:
    name: high
    color: bright_red
  2:
    name: medium
    color: yellow
  3:
    name: low
    color: blue
  4:
    name: trivial
    color: white
default_priority: 2
assignee: null
time_zone: null
