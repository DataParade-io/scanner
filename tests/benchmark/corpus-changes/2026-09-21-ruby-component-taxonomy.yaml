change_id: 2026-09-21-ruby-component-taxonomy
change_type: taxonomy_change
title: Treat internal Ruby application classes as evidence, not architecture components
approved_by: user
approved_at: 2026-09-21
before_policy: Rails models, concerns, and ordinary service classes could be labelled as database or
  service architecture components based on their application role.
after_policy: Rails models, controllers, concerns, jobs, mailers, serializers, and ordinary service
  classes are evidence within an application component, not architecture components. Actual
  datastores, caches, concrete authentication mechanisms, APIs, actors, and third parties remain
  components.
evidence_rationale: The pinned Ruby sources show these records point to application-owned class
  declarations under app/models, app/models/concerns, or app/services. A class that persists rows or
  orchestrates work is not itself the datastore or an independently deployable service.
corpus_delta:
  summary: 129 accepted positive component annotations changed to rejected negative records with empty
    labels, matching the repository loader disposition for invalid component candidates.
  total_changed: 129
scanner_delta:
  summary: None. This corpus-only change does not modify or evaluate production scanner behavior.
  production_scanner_files_changed: 0
