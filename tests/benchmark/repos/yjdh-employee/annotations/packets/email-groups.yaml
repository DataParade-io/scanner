    candidate_groups:
      - applicant-user-email
      - handler-user-email
    reason: "ApplicantTermsApproval.approved_by is the request user who submitted the application (serializers/application.py:1292-1303): an applicant for applicant-origin applications, but a handler for handler-origin (paper) applications, which approve HANDLER_TERMS (terms/models.py terms_approval_needed). This line reads User.email of either kind and the source gives no way to tell which one a row holds."
