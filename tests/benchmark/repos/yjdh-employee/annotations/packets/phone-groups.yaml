repo: yjdh-employee
concept: phone
provenance:
  proposed_by: claude-opus-5-5
  proposed_at: 2026-10-01
  review_state: proposed
groups:
  - id: contact-person-phone
    name: Company contact person phone
    subject: contact person of the applicant company (employer)
    subject_kind: other_person
    purpose: contact number for an application
    rationale: "The Application.company_contact_person_phone_number column (applications/models.py:445) decides the item. Its serializer field list, extra_kwargs and required-field entries (serializers/application.py:203/350/944), the serializer field declaration (498) and the project PhoneNumberField.to_representation that formats its value (common/utils.py:210-213; the class's only use is that field), the CSV selector (applications_csv_report.py:238), the recovery CSV contact (application_alteration_csv_report.py:66) and both PDF templates belong to it. clone_application.py:69 writes the value into a new Application row's same column: rows copied within one column are the same item."
    clusters:
      - c001
      - c002
      - c003
      - c004
      - c005
      - c007
      - c009
  - id: employee-phone
    name: Employee phone
    subject: employee the benefit application is for
    subject_kind: other_person
    purpose: contact number of the subsidised employee
    rationale: The Employee.phone_number column (applications/models.py:1102) decides the item, with the employee.phone_number CSV selector (applications_csv_report.py:265). The employee is a different subject from the company contact person.
    clusters:
      - c006
      - c008
