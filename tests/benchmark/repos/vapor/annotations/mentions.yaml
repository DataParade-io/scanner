annotations:
  - id: vapor-username-signal
    layer: mentions
    subject:
      key: mention:user_identifier
      name: username
    evidence:
      file_path: Sources/Vapor/Authentication/BasicAuthorization.swift
      start_line: 10
      end_line: 11
    expected:
      status: positive
      labels:
        - user_identifier
        - legacy-key:pii:user_identifier
    rationale: BasicAuthorization.username is a live login identifier parsed from the Authorization header and may be an email address.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: vapor-password-signal
    layer: mentions
    subject:
      key: mention:password
      name: password
    evidence:
      file_path: Sources/Vapor/Authentication/BasicAuthorization.swift
      start_line: 13
      end_line: 14
    expected:
      status: positive
      labels:
        - credential_secret
    rationale: BasicAuthorization.password holds the plaintext credential decoded from the Basic auth header.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: accepted
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: vapor-bearer-token-signal
    layer: mentions
    subject:
      key: mention:access_token
      name: token
    evidence:
      file_path: Sources/Vapor/Authentication/BearerAuthorization.swift
      start_line: 5
      end_line: 6
    expected:
      status: positive
      labels:
        - access_token
        - legacy-key:pii:access_token
    rationale: BearerAuthorization.token is the bearer secret extracted from the Authorization header.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: vapor-realm-not-pii
    layer: mentions
    subject:
      key: mention:email
      name: realm
    evidence:
      file_path: Sources/Vapor/Authentication/Authenticator.swift
      start_line: 66
      end_line: 67
    expected:
      status: negative
      labels: []
    rationale: The default BasicAuthenticator realm string is a static challenge label, not a personal identifier or email address.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
