annotations:
- id: jarviscore-flow-atoms-to-crisp
  layer: data_flows
  subject:
    key: flow:asset:service->third_party:crisp
    name: integration atoms to crisp
  evidence:
    file_path: jarviscore/integrations/atoms/crisp/crisp_create_message.py
    start_line: 24
    end_line: 25
  expected:
    status: positive
    labels:
    - data_flow
  rationale: crisp_create_message posts the caller payload as a new message to the Crisp conversation/{session_id}/message
    endpoint; source is asset:service because no HTTP handler is in scope.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: accepted
    reviewed_by: ryan-porter
    reviewed_at: '2026-10-29'
  flow_canonical:
    identity_key: flow:asset:service->third_party:messaging
    disposition_candidate: graph_edge
    source_entity_id: jarviscore::jarviscore-atoms-service
    target_entity_id: jarviscore::jarviscore-crisp-create-message
    endpoints:
      source:
        component_type: asset
        endpoint_key: service
        component_subtype: service
      target:
        component_type: third_party
        endpoint_key: crisp
        component_subtype: messaging
    data_categories:
    - message_content
