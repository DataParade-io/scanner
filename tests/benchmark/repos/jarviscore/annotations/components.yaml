annotations:
- id: jarviscore-atoms-service
  layer: components
  subject:
    key: asset:service
    name: integration atoms
  evidence:
    file_path: jarviscore/integrations/atoms/crisp/crisp_create_conversation.py
    start_line: 12
    end_line: 12
  expected:
    status: ambiguous
    labels:
    - service
  rationale: The atoms are async tool functions that an agent runtime calls through an injected nexus_call global;
    no HTTP handler or service entry point is in scope, so asset:service is the closest calling component but reviewers
    may reject it as a library of functions.
