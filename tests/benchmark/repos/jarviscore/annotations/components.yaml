- id: jarviscore-crisp-create-conversation
  layer: components
  subject:
    key: third_party:crisp
    name: crisp
  evidence:
    file_path: jarviscore/integrations/atoms/crisp/crisp_create_conversation.py
    start_line: 21
    end_line: 22
  expected:
    status: positive
    labels:
    - messaging
  rationale: crisp_create_conversation builds a URL from _crisp_api_root, which defaults to CRISP_API https://api.crisp.chat/v1
    on line 2, and sends a POST through _crisp_post (nexus_call on line 49). The same vendor is also called at jarviscore/integrations/atoms/crisp/crisp_create_message.py:24,
    jarviscore/integrations/atoms/crisp/crisp_get_conversation.py:13, jarviscore/integrations/atoms/crisp/crisp_get_message.py:16,
    jarviscore/integrations/atoms/crisp/crisp_list_conversations.py:67, jarviscore/integrations/atoms/crisp/crisp_list_messages.py:76,
    jarviscore/integrations/atoms/crisp/crisp_search_records.py:69, jarviscore/integrations/atoms/crisp/crisp_update_conversation.py:21,
    jarviscore/integrations/atoms/crisp/crisp_update_message.py:24; one record per vendor because the scanner models
    one component per vendor.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: proposed
  canonical:
    entity_id: jarviscore::jarviscore-crisp-create-conversation
    identity_key: third_party:messaging
    component_type: third_party
    component_subtype: messaging
    vendor: crisp
- id: jarviscore-whatsapp-create-message
  layer: components
  subject:
    key: third_party:whatsapp
    name: whatsapp
  evidence:
    file_path: jarviscore/integrations/atoms/whatsapp_business/whatsapp_business_create_message.py
    start_line: 26
    end_line: 26
  expected:
    status: positive
    labels:
    - messaging
  rationale: whatsapp_business_create_message calls nexus_call with a POST to {root}/{pid}/messages to send a text
    message, where root comes from _wa_root and defaults to _WA_ROOT https://graph.facebook.com/v19.0 on line 2.
    The same vendor is also called at jarviscore/integrations/atoms/whatsapp_business/whatsapp_business_get_message.py:13,
    jarviscore/integrations/atoms/whatsapp_business/whatsapp_business_list_messages.py:14, jarviscore/integrations/atoms/whatsapp_business/whatsapp_business_search_records.py:16;
    one record per vendor because the scanner models one component per vendor.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: proposed
  canonical:
    entity_id: jarviscore::jarviscore-whatsapp-create-message
    identity_key: third_party:messaging
    component_type: third_party
    component_subtype: messaging
    vendor: whatsapp
