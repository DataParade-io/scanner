annotations:
- id: omni-ai-automation-flow-service-to-whatsapp-cloud-api
  layer: data_flows
  subject:
    key: flow:asset:service->third_party:whatsapp
    name: Backend service to whatsapp
  evidence:
    file_path: backend/app/integrations/whatsapp/adapter.py
    start_line: 235
    end_line: 239
  expected:
    status: positive
    labels:
    - data_flow
  rationale: send_message posts the reply text to the recipient WhatsApp id (the phone number) with a
    Bearer access token; the adapter is called by backend services, not directly by an in-scope HTTP handler,
    so the source is asset:service.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: proposed
  flow_canonical:
    identity_key: flow:asset:service->third_party:messaging
    disposition_candidate: graph_edge
    source_entity_id: omni-ai-automation::omni-ai-automation-backend-service
    target_entity_id: omni-ai-automation::omni-ai-automation-whatsapp-cloud-api
    endpoints:
      source:
        component_type: asset
        endpoint_key: service
        component_subtype: service
      target:
        component_type: third_party
        endpoint_key: messaging
        component_subtype: messaging
        vendor: whatsapp
    data_categories:
    - message_content
    - phone_number
    - access_token
