version: third-party-labels/1
scope_note: No in-scope code in app/models or config reaches a vendor. LDAP (auth_source_ldap.rb) binds to the operator's
  own directory, webhook.rb posts to admin-entered URLs and mail uses the configured SMTP host; Gravatar is only documented
  in config (settings.yml gravatar_enabled, a commented avatar_server_url default) and is reached by helper code outside
  the scope.
vendors: []
