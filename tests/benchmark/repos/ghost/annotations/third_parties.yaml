version: third-party-labels/1
scope_note: ghost/core reaches payment, email, storage, error, analytics, geolocation, avatar, oEmbed and Ghost's own update
  and Explore services. Generic oEmbed and metascraper lookups to arbitrary provider URLs, webhooks, webmentions,
  recommendations, the media inliner, ActivityPub on the site's own URL and config-only logging and metrics transports are
  not vendor records.
