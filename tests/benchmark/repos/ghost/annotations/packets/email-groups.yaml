groups:
- id: member-account-email
  name: Member account email
  subject: member
  purpose: sign-in, newsletters, comment notifications and other member communication
  rationale: members.email column (schema.js:649, validated schema.js:654) is the model field. Clusters are reads and writes of it on Member instances (member.get('email'), memberModel.get('email'), findOne({email}), attrs.email in models/member.js, 'members.email' selector, member-repository create/edit/get lookups and pick lists), the member add/read request fields in api/endpoints/members.js, the member emails handed to email-service recipient building (sending-service buildRecipients member.email -> recipient.email -> mailgun-email-provider), the comment notification recipients and reporter (comments-service reportComment uses reporter.id as member_id, so the reporter is a member), the member import row email, memberEmail passed to triggerMemberSignupAutomation (from newMember.get('email') / memberModel.get('email')), the gift redemption member email (gift-service passes member.get('email')), and staff-service getDataFromIds member data (member.email of a Member model). Stored copies in other tables (stripe customers, recipients, events, suppressions) are separate groups.
