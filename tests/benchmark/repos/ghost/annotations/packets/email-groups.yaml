- id: outbound-message-from-address
  name: Outbound message from address
  subject: outgoing email message
  purpose: the sender address of a message passed through GhostMailer and the address resolution in EmailAddressService
  rationale: ghost-mailer getFromAddress(requestedFromAddress) passes the message from to emailAddress.service.getAddressFromString(from), which parses it and hands it to getAddress (preferred.from); the resolved addresses.from becomes the Sender header. Callers supply different senders, so the group is defined by the message field, not by a single site setting.
  clusters:
  - c086
  - c093
  - c097
  - c098
  - c113
  - c114
- id: outbound-message-reply-to-address
  name: Outbound message reply-to address
  subject: outgoing email message
  purpose: the reply-to address of a message passed through GhostMailer and EmailAddressService
  rationale: ghost-mailer getFromAddress(requestedReplyToAddress) -> getAddressFromString(from, replyTo) -> getAddress preferred.replyTo, validated and possibly dropped.
  clusters:
  - c083
  - c084
  - c095
