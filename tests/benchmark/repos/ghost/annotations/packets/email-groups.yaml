  rationale: prepAttrsForEmailVerification takes email = cleanedAttrs[property] (sender_email or sender_reply_to), pushes it to emailsToVerify, respondWithEmailVerification passes {email, property} to sendEmailVerificationMagicLink, whose email goes to magicLinkService.sendMagicLink; the MagicLink getText/getHTML callbacks (newsletters-service getText, getHTML, verifyEmailTemplate) receive it as their email argument. Mixes the newsletter from and reply-to addresses because the code path is shared.
