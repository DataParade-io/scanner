groups:
  - id: contact-phone
    name: Contact phone number
    subject: a contact (the account's customer or visitor)
    subject_kind: end_user
    purpose: contact identity and SMS/WhatsApp reachability
    rationale: "contacts.phone_number column (schema.rb:798 and its indexes, validated E.164 in contact.rb:54) with every read, write and lookup of it: the model callbacks and payloads, ContactIdentifyAction and ContactMergeAction, ContactInboxBuilder (which reads it to derive source ids), the widget, public and dashboard params, search and filter attributes, exports, CRM, LLM, Slack unfurl and campaign sends, data imports (importer, CSV ContactManager, Freshdesk normalizer), and the inbound SMS, Twilio and WhatsApp flows that turn the sender's number into contact attributes (incoming_message_service phone_number getters, contact_attributes_for_identifier, IdentifierSyncService, UserIdRotationService and ContactInfoResponseService). The sender numbers of inbound messages are request inputs written to and looked up against contacts.phone_number, so they are this item; the lines that turn them into contact inbox source ids are in contact-inbox-source-id."
