  - id: contact-name-phone-copy
    name: Contact name filled from phone number
    subject: a contact created from an inbound SMS or WhatsApp message
    subject_kind: end_user
    purpose: fallback display name
    rationale: "The inbound flows name a new contact after its number when no profile name exists: the WhatsApp name fallback (incoming_message_identifier_helper.rb:92/103), the rotation rename (user_id_rotation_service.rb:115), the Twilio contact_name fallback (twilio/incoming_message_service.rb:127) and the SMS contact name (sms/incoming_message_service.rb:74). The lines name the contact's name as their target, so the number is copied into contacts.name."
    clusters:
      - c072
      - c080
      - c121
      - c125
      - c172
