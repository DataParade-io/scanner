  - id: contact-inbox-source-id
    name: Contact inbox source id (phone-based)
    subject: a contact's WhatsApp or SMS identity in one inbox
    subject_kind: end_user
    purpose: per-inbox contact address used to route and reply
    rationale: "contact_inboxes.source_id holds the contact's phone-based WhatsApp id (wa_id digits, or whatsapp:+number for Twilio) or SMS number: the phone_source_id locals and getters that build it (incoming_message_identifier_helper.rb:54-83, IdentitySourceIdOrderer, UserIdRotationService, twilio_whatsapp_phone_source_id, normalized_phone_number), the lookups by source_id (user_id_rotation_service.rb:131, contact_info_response_service.rb:103/119), and the recipients read from conversation.contact_inbox.source_id: the WhatsApp provider send_message methods (SendOnWhatsappService passes the source id), the CSAT template sends and Twilio send_csat_template_message. A separate stored copy of the contact's number (it can also hold a BSUID)."
