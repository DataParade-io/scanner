    name: Imported contact raw phone
    subject: an imported Freshdesk or Intercom contact
    subject_kind: end_user
    purpose: source phone kept as import metadata
    rationale: Contact source metadata raw_phone (freshdesk/metadata.rb:13, intercom/source.rb:134), stored in the contact's additional_attributes source block and the import mapping metadata, separate from the normalized contacts.phone_number.
    clusters:
