needs_adjudication:
  - cluster: c152
    candidate_groups:
      - contact-inbox-source-id
      - contact-phone
    reason: send_template(phone_number, ...) is called with the conversation's contact_inbox.source_id (SendOnWhatsappService, CsatSurveyService) and with contact.phone_number for one-off campaign recipients (oneoff_campaign_service.rb:106/129); the parameter holds either item.
  - cluster: c154
    candidate_groups:
      - contact-inbox-source-id
      - contact-phone
    reason: send_template(phone_number, ...) is called with the conversation's contact_inbox.source_id (SendOnWhatsappService, CsatSurveyService) and with contact.phone_number for one-off campaign recipients (oneoff_campaign_service.rb:106/129); the parameter holds either item.
  - cluster: c160
    candidate_groups:
      - contact-inbox-source-id
      - contact-phone
    reason: send_template(phone_number, ...) is called with the conversation's contact_inbox.source_id (SendOnWhatsappService, CsatSurveyService) and with contact.phone_number for one-off campaign recipients (oneoff_campaign_service.rb:106/129); the parameter holds either item.
  - cluster: c166
    candidate_groups:
      - contact-phone
      - contact-inbox-source-id
    reason: "raw_phone_source_id holds the contact's new wa_id from a user_changed_number event and feeds both stored places: it is normalized into the phone contact inbox source id (line 30) and written as +number into contacts.phone_number (record_phone_identity, line 92)."
  - cluster: c181
    candidate_groups:
      - twilio-channel-phone
      - sms-channel-phone
      - whatsapp-channel-phone
    reason: The inbox payload renders resource.channel.try(:phone_number) for every inbox type; Twilio, SMS (Bandwidth) and WhatsApp channels each store their own number in a different table.
