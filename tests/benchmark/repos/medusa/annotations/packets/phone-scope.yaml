concept: phone
layer: occurrences
purpose: Phone number mention scope for KDATAP-939370 labeling over the widened medusa checkout. Merged into layer-scopes.yaml with the labels.
provenance:
  proposed_by: claude-sonnet-5-5
  proposed_at: '2026-10-01'
  review_state: proposed
materialized_scope:
- packages/medusa/src/
- packages/modules/{customer,cart,order,fulfillment,stock-location,settings,payment,notification}/
- packages/core/core-flows/
- packages/core/types/
left_out:
- path: packages/admin/dashboard/
  reason: admin UI strings, forms and translations (47 files mention phone); a display layer over the same API fields, not materialized
- path: packages/plugins/draft-order/
  reason: admin draft-order UI plugin; address phone appears only as form fields over the order address API
- path: packages/core/js-sdk/, packages/design-system/icons/
  reason: client SDK typing and icon names, no phone data handled
- path: packages/modules/providers/
  reason: one match in a provider package outside the requested module list
- path: tests, __tests__, __fixtures__, __mocks__, integration-tests, *.spec.*, *.test.*
  reason: test code, as for saleor and the email scopes
- path: migrations, dist, *.d.ts, CHANGELOG.md, package.json, tsconfig*
  reason: generated or non-code files; package.json and tsconfig matched only on unrelated words
- path: markdown and yaml files (docs, OpenAPI sources)
  reason: documentation, not handling code
