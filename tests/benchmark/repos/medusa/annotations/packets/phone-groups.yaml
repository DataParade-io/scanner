- id: order-address-phone
  name: Order address phone
  subject: order shipping or billing contact
  subject_kind: end_user
  purpose: contact number on the shipping and billing address of an order
  rationale: The OrderAddress.phone column (modules/order/src/models/address.ts:16) decides the item, with its GraphQL type, order address DTOs, upsert DTO, admin and common HTTP order address types and the fulfillment module view of an order address (FulfillmentOrderAddressDTO). Stored in its own table, so a different item from the cart and customer addresses it is copied from at order creation.
  clusters:
