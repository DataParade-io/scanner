groups:
- id: customer-phone
  name: Customer phone
  subject: customer
  subject_kind: end_user
  purpose: contact number of a customer account
  rationale: The Customer.phone column (modules/customer/src/models/customer.ts:13) decides the item. Its type members (CustomerDTO, create/update DTOs, store and admin HTTP types), request validators (admin and store CreateCustomer/UpdateCustomer), field selectors (customer query-config field lists, create-payment-session customer fields, Order customer_display columns in settings), the rollback restore in update-customers, and the value passed on to the payment provider account holder (medusa-payments.ts, PaymentCustomerDTO) all belong to it; values passed between functions belong to their source.
