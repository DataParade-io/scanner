  - c066
  - c067
- id: fulfillment-address-phone
  name: Fulfillment address phone
  subject: fulfillment delivery address
  subject_kind: end_user
  purpose: contact number on the delivery address of a fulfillment
  rationale: The FulfillmentAddress.phone column (modules/fulfillment/src/models/address.ts:14) decides the item, with its GraphQL type, fulfillment address DTOs, create DTO, workflow DTO and admin and store HTTP types. Stored in its own table, so a different item from the order address it is created from. The same row also holds the stock location address for return fulfillments (create-return-fulfillment passes the location), so the subject is mixed; see report.
