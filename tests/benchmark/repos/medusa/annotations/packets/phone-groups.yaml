needs_adjudication:
- cluster: c005
  candidate_groups:
  - customer-address-phone
  - cart-address-phone
  - order-address-phone
  - fulfillment-address-phone
  - stock-location-address-phone
  reason: AddressDTO is the generic address shape; the importers that say which table it describes are outside the scoped files, so the subject is not visible
- cluster: c021
  candidate_groups:
  - customer-address-phone
  - cart-address-phone
  - order-address-phone
  reason: BaseAddress is a generic HTTP address entity (it carries customer_id) that other address types extend or mirror; which address table it stands for is not settled by the file
- cluster: c057
  candidate_groups:
  - order-address-phone
  - fulfillment-address-phone
  reason: AddressPayload is shared by the admin order, draft order and fulfillment validators (shipping, billing and delivery addresses), which write to different address tables
