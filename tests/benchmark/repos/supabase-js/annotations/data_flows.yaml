annotations:
  - id: supabase-js-credentials-to-gotrue
    layer: data_flows
    subject:
      key: flow:credentials->gotrue-token
      name: Credentials to GoTrue token endpoint
    evidence:
      file_path: packages/core/auth-js/src/GoTrueClient.ts
      start_line: 1233
      end_line: 1240
    expected:
      status: positive
      labels:
        - data_flow
    rationale: signInWithPassword sends email and password to the GoTrue /token?grant_type=password endpoint.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: supabase-js-session-to-storage
    layer: data_flows
    subject:
      key: flow:session->local-storage
      name: Session to local storage
    evidence:
      file_path: packages/core/auth-js/src/GoTrueClient.ts
      start_line: 5234
      end_line: 5240
    expected:
      status: positive
      labels:
        - data_flow
    rationale: _saveSession persists the cloned session (tokens and metadata) into configured storage under storageKey.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: supabase-js-access-token-to-authorization
    layer: data_flows
    subject:
      key: flow:access-token->authorization-header
      name: Access token to Authorization header
    evidence:
      file_path: packages/core/supabase-js/src/lib/fetch.ts
      start_line: 90
      end_line: 94
    expected:
      status: positive
      labels:
        - data_flow
    rationale: fetchWithAuth attaches the session access token (or API key fallback) as a Bearer Authorization header on outbound requests.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: supabase-js-refresh-to-token-endpoint
    layer: data_flows
    subject:
      key: flow:refresh-token->gotrue
      name: Refresh token to GoTrue
    evidence:
      file_path: packages/core/auth-js/src/GoTrueClient.ts
      start_line: 4769
      end_line: 4772
    expected:
      status: positive
      labels:
        - data_flow
    rationale: Token refresh posts refresh_token to /token?grant_type=refresh_token to obtain a new session.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: supabase-js-storage-key-not-flow
    layer: data_flows
    subject:
      key: flow:storage-key->database
      name: Storage key to database
    evidence:
      file_path: packages/core/auth-js/src/lib/constants.ts
      start_line: 25
      end_line: 25
    expected:
      status: negative
      labels: []
    rationale: STORAGE_KEY is a local storage key name constant. It does not flow data to a database.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: rejected
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
