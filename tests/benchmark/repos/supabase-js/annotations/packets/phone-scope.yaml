concept: phone
layer: mentions
purpose: Phone number mention scope for KDATAP-e60143 labeling over the supabase-js auth client (auth-js) sources (held-out repo). Merged into layer-scopes.yaml with the labels.
provenance:
  proposed_by: claude-opus-5-5
  proposed_at: 2026-10-01
  review_state: proposed
materialized_scope:
  - packages/
labeled_scope:
  - packages/core/auth-js/src/
left_out:
  - path: packages/core/auth-js/test/
    reason: unit and docker integration tests with literal test addresses and numbers
  - path: packages/core/auth-js/example/
    reason: demo React app and its Playwright tests; consumer code over the client API, not the auth client
  - path: packages/core/auth-js/infra/
    reason: docker-compose and SQL schema for the integration test GoTrue server
  - path: packages/core/auth-js/migrations/, README.md, CHANGELOG.md, AGENTS.md
    reason: documentation
  - path: packages/core/auth-js/package.json, project.json, tsconfig*.json, jest.config*.js, eslint.config.mjs
    reason: package and tool configuration
  - path: packages/core/auth-js/src/lib/version.ts
    reason: generated by genversion (holds only the version string)
  - path: packages/core/{supabase-js,postgrest-js,realtime-js,storage-js,functions-js}/, packages/shared/
    reason: not the auth client; their sources have no email or phone token (supabase-js SupabaseAuthClient only wraps the auth-js client)
not_added_beyond_token_candidates:
  reason: "Lines that pass whole attribute or parameter objects (createUser and updateUserById body: attributes, updateUser ...attributes, verifyOtp ...params, the generateLink user ...rest) carry every field of the object, not this value specifically, and are not labeled."
