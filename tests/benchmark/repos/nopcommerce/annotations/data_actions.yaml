annotations:
  - id: nopcommerce-customer-store
    layer: data_actions
    subject:
      key: asset:customer
      name: Customer
    evidence:
      file_path: src/Libraries/Nop.Core/Domain/Customers/Customer.cs
      start_line: 24
      end_line: 94
    expected:
      status: positive
      labels:
        - store
    rationale: >-
      Customer domain entity declares Username, Email, FirstName, LastName,
      DateOfBirth, StreetAddress, Phone and related profile columns as persisted
      properties (PRD store). Cross-ref components nopcommerce-customer-database;
      actor:customer deliberately omitted (DA-1).
    provenance:
      proposed_by: data-actions-tier-c-agent
      proposed_at: 2026-09-07
      reviewed_by: source-adjudication
      reviewed_at: 2026-09-07
      review_state: accepted
