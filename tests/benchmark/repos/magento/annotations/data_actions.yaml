      start_line: 609
      end_line: 625
    expected:
      status: positive
      labels:
        - transform
    rationale: >-
      setPassword / hashPassword call EncryptorInterface.getHash to convert
      plaintext passwords into salted hashes before retention (PRD transform;
      multi-verb with store). Cross-ref components magento-customer-model.
    provenance:
      proposed_by: data-actions-tier-c-agent
      proposed_at: 2026-09-07
      reviewed_by: source-adjudication
