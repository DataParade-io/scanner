annotations:
  - id: magento-customer-store
    layer: data_actions
    subject:
      key: asset:customer
      name: Customer
    evidence:
      file_path: app/code/Magento/Customer/Model/Customer.php
      start_line: 34
      end_line: 41
    expected:
      status: positive
      labels:
        - store
    rationale: >-
      Customer model declares getEmail / setPasswordHash accessors for persisted
      account identity and credential hash fields (PRD store). ResourceModel
      Customer._beforeSave also binds email onto customer_entity. Cross-ref
      components magento-customer-model / magento-customer-entity-database;
      actor:customer omitted (DA-1).
    provenance:
      proposed_by: data-actions-tier-c-agent
      proposed_at: 2026-09-07
      reviewed_by: source-adjudication
      reviewed_at: 2026-09-07
      review_state: accepted
