version: third-party-labels/1
scope_note: Vendors reached from src/wp-includes. The AI client and connector registry only list Anthropic, Google, OpenAI
  and Akismet for plugins to implement; pingbacks, trackbacks, feeds, URL details, remote styles and the AI HTTP adapter
  call user- or plugin-supplied URLs, and mail goes through PHPMailer to the configured host.
vendors:
- vendor: wordpress_org
  subject_key: third_party:wordpress_org
  component_subtype: saas_service
  sends_data: true
  route: raw_http
  subprocessor: "no"
  data_categories: [configuration, telemetry, search_query, ip_address]
  provenance:
    manifest: []
    imports: []
    call_sites:
    - {file_path: src/wp-includes/update.php, line: 246}
    - {file_path: src/wp-includes/update.php, line: 258}
    - {file_path: src/wp-includes/update.php, line: 472}
    - {file_path: src/wp-includes/update.php, line: 484}
    - {file_path: src/wp-includes/update.php, line: 758}
    - {file_path: src/wp-includes/update.php, line: 770}
    - {file_path: src/wp-includes/rest-api/endpoints/class-wp-rest-pattern-directory-controller.php, line: 130}
    - {file_path: src/wp-includes/fonts.php, line: 269}
    - {file_path: src/wp-includes/fonts/class-wp-font-collection.php, line: 182}
    - {file_path: src/wp-includes/formatting.php, line: 6042}
    - {file_path: src/wp-includes/formatting.php, line: 6060}
    - {file_path: src/wp-includes/formatting.php, line: 6167}
  uncertain: false
  rationale: update.php posts the WordPress, PHP and MySQL versions, locale, user and site counts, installed plugins and
    themes and the site URL to api.wordpress.org; the pattern directory proxies searches to api.wordpress.org/patterns, the
    font library fetches the Google Fonts collection from s.w.org, and emoji images load from the s.w.org CDN in visitors'
    browsers.
  review_state: proposed
  proposed_by: claude-opus-5.5
  proposed_at: '2026-11-12'
