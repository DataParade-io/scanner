- id: wordpress-wp-mail-disclose
  layer: data_actions
  subject:
    key: asset:wp_mail
    name: wp_mail
  evidence:
    file_path: src/wp-includes/pluggable.php
    start_line: 189
    end_line: 189
  expected:
    status: positive
    labels:
    - disclose
  rationale: wp_mail sends message bodies and recipient addresses through the outbound mail path (PHPMailer/SMTP)
