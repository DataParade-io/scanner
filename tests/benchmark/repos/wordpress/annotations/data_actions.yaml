annotations:
- id: wordpress-wpdb-store
  layer: data_actions
  subject:
    key: asset:wpdb
    name: wpdb
  evidence:
    file_path: src/wp-includes/class-wpdb.php
    start_line: 55
    end_line: 55
  expected:
    status: positive
    labels:
    - store
  rationale: wpdb is WordPress's MySQL access layer that persists site and user rows (PRD store). Cross-ref
    wordpress-database.
  provenance:
    proposed_by: data-actions-tier-c-agent
    proposed_at: '2026-09-07'
    reviewed_by: source-adjudication
    reviewed_at: '2026-09-07'
    review_state: accepted
- id: wordpress-wp-insert-user-store
