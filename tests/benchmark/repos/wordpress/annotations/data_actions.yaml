- id: wordpress-wp-hash-password-transform
  layer: data_actions
  subject:
    key: asset:wp_hash_password
    name: wp_hash_password
  evidence:
    file_path: src/wp-includes/pluggable.php
    start_line: 2812
    end_line: 2819
  expected:
    status: positive
    labels:
    - transform
  rationale: wp_hash_password HMAC-prehashes then bcrypt-hashes plaintext passwords before retention
    (PRD transform / pseudonymization). Cross-ref wordpress-wp-hash-password.
  provenance:
    proposed_by: data-actions-tier-c-agent
    proposed_at: '2026-09-07'
    reviewed_by: source-adjudication
    reviewed_at: '2026-09-07'
    review_state: accepted
