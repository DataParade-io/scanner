  subject:
    key: asset:wp_insert_user
    name: wp_insert_user
  evidence:
    file_path: src/wp-includes/user.php
    start_line: 2574
    end_line: 2577
  expected:
    status: positive
    labels:
    - store
  rationale: wp_insert_user writes user_login/user_email/user_pass (and related fields) via $wpdb->insert/$wpdb->update
    into wp_users (PRD store). Cross-ref wordpress-wp-insert-user.
  provenance:
    proposed_by: data-actions-tier-c-agent
