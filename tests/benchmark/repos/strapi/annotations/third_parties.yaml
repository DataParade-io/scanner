  review_state: proposed
  proposed_by: claude-opus-5.5
  proposed_at: '2026-11-12'
- vendor: jsdelivr
  subject_key: third_party:jsdelivr
  component_subtype: saas_service
  sends_data: true
  route: raw_http
  subprocessor: "no"
  data_categories: [non_personal]
  provenance:
    manifest: []
    imports: []
    call_sites:
    - {file_path: packages/core/content-manager/server/src/preview/controllers/previewScript.js, line: 305}
  uncertain: false
  rationale: The preview script served into the preview iframe dynamically imports @vercel/stega from cdn.jsdelivr.net;
