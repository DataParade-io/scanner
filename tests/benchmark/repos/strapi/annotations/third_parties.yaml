- vendor: mux
  subject_key: third_party:mux
  component_subtype: analytics
  sends_data: true
  route: sdk
  subprocessor: "unknown"
  data_categories: [telemetry]
  provenance:
    manifest:
    - {file_path: packages/core/upload/package.json, line: 73, package: '@mux/mux-player-react'}
    imports:
    - {file_path: packages/core/upload/admin/src/components/EditAssetDialog/PreviewBox/AssetPreview.tsx, line: 4, module: '@mux/mux-player-react'}
    call_sites:
    - {file_path: packages/core/upload/admin/src/components/EditAssetDialog/PreviewBox/AssetPreview.tsx, line: 52}
  uncertain: true
  rationale: The media library previews videos with MuxPlayer on the asset's own URL. Mux Player bundles Mux Data playback
    analytics, but without a Mux playback id or env key it may send nothing, so whether Mux is reached is unclear.
  review_state: proposed
  proposed_by: claude-opus-5.5
  proposed_at: '2026-11-12'
