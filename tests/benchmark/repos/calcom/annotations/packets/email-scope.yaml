concept: email
layer: occurrences
purpose: 'Email address occurrence scope for KDATAP-b8e4a8 labeling over the cal.com stored-people-data core (held-out repo): packages/prisma, packages/features, packages/lib, apps/web/lib and apps/web/server. Merged into layer-scopes.yaml with the labels.'
provenance:
  proposed_by: claude-opus-5-5
  proposed_at: '2026-10-02'
  review_state: proposed
materialized_scope:
- packages/prisma/
- packages/features/
- packages/lib/
- apps/web/lib/
- apps/web/server/
labeled_scope:
- packages/prisma/ (schema.prisma, selects, zod-utils, extensions; less migrations/ and the seed script)
- packages/features/ (less packages/features/embed/ and tests)
- packages/lib/ (less tests and test-mode capture helpers)
- apps/web/lib/
- apps/web/server/
left_out:
- path: packages/prisma/migrations/
  reason: generated SQL migration history (596 files); packages/prisma/schema.prisma is the labeled schema
- path: tests, mocks and test helpers (*.test.ts(x), *.spec.ts, *.integration-test.ts, __tests__/, __mocks__/, test/, tests/, testUtils.ts, *.mock.ts)
  reason: test code and fixtures
- path: packages/lib/testEmails.ts, packages/lib/testSMS.ts, packages/prisma/seed-pbac-only.ts
  reason: test-mode capture of sent emails and SMS, and a seed script (test and seed fixtures)
- path: packages/features/embed/
  reason: embed snippet and preview UI; the embed code is out of scope
- path: non-code files (*.md, *.json, *.sql, *.yml, *.js config, *.css, .env, docker-compose)
  reason: documentation, package manifests and configuration, not handling code
- path: packages/trpc/, packages/app-store/, packages/emails/, packages/sms/, packages/platform/, packages/ui/, packages/coss-ui/, packages/embeds/, packages/i18n/ (locales), apps/api/, apps/web/app/, apps/web/pages/, apps/web/modules/, apps/web/components/, apps/web/playwright/
  reason: 'not materialized: the tRPC routers, app store integrations, email and SMS templates, platform libraries, UI component libraries, embed packages, translation catalogs, the public API and the Next.js pages and components; the scope keeps the stored-people-data core to about 1,000 files'
not_added_beyond_token_candidates:
  reason: Every candidate line from the email token list (email, e_mail, mail_to, mailto, recipient, sender, from_address) is labeled once. Lines that handle the value without a token on the line (for example a calendar event attendee list passed whole, the VerificationToken.identifier and Watchlist.value columns, Booking.cancelledBy and rescheduledBy columns, or a value read through a destructuring rename) are not added.
labeling_conventions:
- 'The record labels the chosen token on the line: positive when that token denotes or holds the value (a Prisma column, a select/where/data key, a type or zod member, a local, parameter, payload key, request param, a getter, or a literal naming the field), negative for comments, log and error text, translation keys, type and class names, function and method names, imports, booleans and settings flags, ids, enum values naming a kind, validators, domains (orgAutoAcceptEmail, free email domain lists) and container tokens that name a whole record or message (a SecondaryEmail relation, a list of person records, an email message object).'
- Functions that take an argument and act on a value are function names (negative); their parameters are positive. When a line holds several tokens, the record labels the first token that holds a value.
- 'Declarations: identifiers resolve to their local, parameter, field or function declaration in the same file or one relative import away; member accesses resolve to the member''s declaration when the object''s type is written in the same file or one relative import away (inline type literals included); keys of untyped object literals declare themselves. Prisma-generated types (any read of a Prisma result row, select/where/data keys), types reached through a package import (@calcom/*, next-auth, zod types from another package) and outside code are `unresolved`; string literals naming a field carry no declaration.'
- A line that writes or looks up a stored column (or an external system's field) names that column's item; other lines take the item of the value they read; values passed between functions keep their source's item. When one line reads several items (a fallback chain), it takes the item it reads first.
- Booker and guest addresses in flight at booking time (bookerEmail, the request responses email and guests, calendar event attendees) are the Attendee.email item, since the request value is written to Attendee.email; reads of a stored booking's responses are the Booking.responses item. A team member read through a membership or host relation is the User.email item (same column, no flag tells them apart).
