- id: user-email
  name: Cal.com user email
  subject: a Cal.com account user (users table), read as the signed-in user, organizer, host, round robin
    candidate, team or organization member, credential owner or reporter
  subject_kind: end_user
  purpose: sign-in, sign-up, notifications, organizer identity on bookings and host matching
  rationale: 'User.email column (schema.prisma:407, unique at 513/514) and its reads and writes: Prisma
    selects and where clauses in the user, profile, membership, event type, host, booking and OAuth repositories;
    NextAuth credentials, session and identity-provider linking (existing user lookups and email updates);
    sign-up, username validation and password reset lookups; round robin and availability host lists (getLuckyUser,
    getUserAvailability, BookingRepository host-as-attendee matching); team members on calendar events;
    the BookingTimeStatus view column (it selects users.email). Request values that are matched against
    User.email are this item: the teamMemberEmail / contact owner address used for routing, the sign-up
    and login form address, TOTP JWT address. Team and organization members are users in the same column
    with no flag, so they are not split.'
