annotations:
- id: marketmenow-flow-service-to-instagram
  layer: data_flows
  subject:
    key: flow:asset:service->third_party:instagram
    name: Service to instagram
  evidence:
    file_path: src/adapters/instagram/adapter.py
    start_line: 284
    end_line: 288
  expected:
    status: positive
    labels:
    - data_flow
  rationale: InstagramAdapter._post_with_retry posts captions and media URLs with the access_token query parameter
    to the Instagram Graph API for IGAA tokens; the adapter is library code with no HTTP handler in scope, so the
    source is asset:service.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: accepted
    reviewed_by: ryan-porter
    reviewed_at: '2026-10-29'
  flow_canonical:
    identity_key: flow:asset:service->third_party:saas_service
    disposition_candidate: graph_edge
    source_entity_id: marketmenow::marketmenow-adapter-service
    target_entity_id: marketmenow::marketmenow-instagram-graph-adapter
    endpoints:
      source:
        component_type: asset
        endpoint_key: service
        component_subtype: service
      target:
        component_type: third_party
        endpoint_key: saas_service
        component_subtype: saas_service
        vendor: instagram
    data_categories:
    - access_token
    - user_id
    - post_content
