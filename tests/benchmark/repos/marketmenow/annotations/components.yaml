      component_type: third_party
      component_subtype: saas_service
      vendor: facebook_graph
  - id: marketmenow-facebook-graph-token-manager
    layer: components
    subject:
      key: third_party:facebook_graph
      name: facebook_graph
    evidence:
      file_path: src/adapters/instagram/token_manager.py
      start_line: 30
      end_line: 38
    expected:
      status: positive
      labels:
        - saas_service
    rationale: TokenManager exchanges and refreshes tokens at /oauth/access_token on an httpx client whose base_url is _IG_GRAPH_BASE, which despite its name is https://graph.facebook.com/v21.0 (line 7).
    provenance:
      proposed_by: claude-opus-5.5
      proposed_at: 2026-10-29
      review_state: proposed
    canonical:
