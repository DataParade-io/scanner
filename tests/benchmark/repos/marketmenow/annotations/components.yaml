annotations:
  - id: marketmenow-instagram-graph-adapter
    layer: components
    subject:
      key: third_party:instagram
      name: instagram
    evidence:
      file_path: src/adapters/instagram/adapter.py
      start_line: 284
      end_line: 288
    expected:
      status: positive
      labels:
        - saas_service
    rationale: InstagramAdapter posts media containers through an httpx.AsyncClient whose base_url comes from _base_url_for_token, which returns _IG_GRAPH_BASE (https://graph.instagram.com/v21.0, line 14) for IGAA tokens.
    provenance:
      proposed_by: claude-opus-5.5
      proposed_at: 2026-10-29
      review_state: proposed
    canonical:
      entity_id: marketmenow::marketmenow-instagram-graph-adapter
      identity_key: third_party:saas_service
      component_type: third_party
      component_subtype: saas_service
      vendor: instagram
  - id: marketmenow-facebook-graph-adapter
    layer: components
    subject:
      key: third_party:facebook_graph
      name: facebook_graph
    evidence:
      file_path: src/adapters/instagram/adapter.py
      start_line: 284
      end_line: 288
    expected:
      status: positive
      labels:
        - saas_service
    rationale: For EAA (Facebook Login) tokens _base_url_for_token returns _FB_GRAPH_BASE (https://graph.facebook.com/v21.0, line 13), so the same Instagram publishing requests go to the Facebook Graph API.
    provenance:
      proposed_by: claude-opus-5.5
      proposed_at: 2026-10-29
      review_state: proposed
    canonical:
      entity_id: marketmenow::marketmenow-facebook-graph-adapter
