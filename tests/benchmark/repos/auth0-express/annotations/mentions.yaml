annotations:
  - id: auth0-express-access-token-signal
    layer: mentions
    subject:
      key: mention:access_token
      name: access_token
    evidence:
      file_path: lib/context.js
      start_line: 270
      end_line: 270
    expected:
      status: positive
      labels:
        - access_token
        - legacy-key:pii:access_token
    rationale: access_token from the refresh grant is written into the encrypted session and used for API access.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: auth0-express-id-token-signal
    layer: mentions
    subject:
      key: mention:access_token
      name: id_token
    evidence:
      file_path: lib/context.js
      start_line: 1083
      end_line: 1083
    expected:
      status: ambiguous
      labels:
        - legacy-key:pii:access_token
    rationale: id_token is an OIDC identity JWT stored in the session after login; it is not a source-fixed API access_token.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: auth0-express-sub-signal
    layer: mentions
    subject:
      key: mention:user_identifier
      name: sub
    evidence:
      file_path: lib/context.js
      start_line: 1120
      end_line: 1120
    expected:
      status: positive
      labels:
        - user_identifier
        - legacy-key:pii:user_identifier
    rationale: claims.sub is the stable subject identifier used to detect same-user re-login versus account switch.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: auth0-express-client-id-not-email
    layer: mentions
    subject:
      key: mention:email
      name: clientID
    evidence:
      file_path: lib/config.js
      start_line: 203
      end_line: 203
    expected:
      status: negative
      labels: []
    rationale: clientID is an OAuth application identifier, not an email address or other PII field.
    provenance:
      proposed_by: composer-2.5-swarm
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: auth0-express-refresh-token-item-pii-signal
    layer: mentions
    subject:
      key: mention:credential_secret
      name: refresh_token
    evidence:
      file_path: lib/context.js
      start_line: 274
      end_line: 274
    expected:
      status: positive
      labels:
        - credential_secret
        - legacy-key:pii:credential_secret
    rationale: refresh_token is stored in the session and sent to the token endpoint on refresh; it is a credential secret, not the API access_token.
    provenance:
      proposed_by: pii-signal-backport
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
  - id: auth0-express-sid-item-pii-signal
    layer: mentions
    subject:
      key: mention:user_identifier
      name: sid
    evidence:
      file_path: lib/context.js
      start_line: 1097
      end_line: 1097
    expected:
      status: positive
      labels:
        - user_identifier
        - legacy-key:pii:user_identifier
    rationale: session.sid stores the Auth0 session identifier separately because refresh ID tokens may omit sid.
    provenance:
      proposed_by: pii-signal-backport
      proposed_at: 2026-08-30
      review_state: needs_adjudication
      reviewed_by: grok-4.6-refine
      reviewed_at: 2026-08-30
