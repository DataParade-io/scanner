annotations:
- id: scanner-fixtures-meta-conversions-flow
  layer: data_flows
  subject:
    key: flow:asset:service->third_party:meta_conversions_api
    name: Service to meta_conversions_api
  evidence:
    file_path: raw-http-integrations/python/ad_conversions.py
    start_line: 34
    end_line: 34
  expected:
    status: positive
    labels:
    - data_flow
  rationale: report_signup posts hashed email and phone, IP and user agent to CONVERSIONS_URL on graph.facebook.com
    (line 13), with the token in the query string.
  provenance:
    proposed_by: claude-opus-5.5
    proposed_at: '2026-10-29'
    review_state: accepted
    reviewed_by: ryan-porter
    reviewed_at: '2026-10-29'
  flow_canonical:
    identity_key: flow:asset:service->third_party:analytics
    disposition_candidate: graph_edge
    source_entity_id: scanner-fixtures::scanner-fixtures-service
    target_entity_id: scanner-fixtures::scanner-fixtures-meta-conversions
    endpoints:
      source:
        component_type: asset
        endpoint_key: service
        component_subtype: service
      target:
        component_type: third_party
        endpoint_key: meta_conversions_api
        component_subtype: analytics
    data_categories:
    - email
    - phone_number
    - ip_address
    - device_info
