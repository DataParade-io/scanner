version: third-party-labels/1
scope_note: The api/ package reaches AI providers, AI tracing services, email services, cloud storage drivers, deployment
  hosts and Directus's own telemetry, license and marketplace services; OAuth2, OpenID, SAML, LDAP, SMTP, the openai-compatible
  provider and the flow request operation use admin-configured endpoints and are not vendor records.
