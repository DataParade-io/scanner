- id: address-phone-number
  name: Address phone number
  subject: address holder (customer address book entry)
  subject_kind: end_user
  purpose: contact number stored with a postal address
  rationale: 'The Address.phone column (account/models.py:74, PossiblePhoneNumberField) decides the item. Its reads and writes by instance (account/search.py:137/140 address.phone, core/anonymize.py:27), the by-name references to it (models.py:98 search index fields, models.py:123/124 as_data keys), the address form field that is saved into it (AddressForm phone field i18n.py:109, the local read from its cleaned data at i18n.py:138-142, add_error("phone") at i18n.py:144, the prefilled initial["phone"] in forms.py:16) and the validator that is both the model field default validator and called from AddressForm.clean (validators.py:8-19) all belong to it. Checkout and order addresses are copies that Address.get_copy (models.py:127) writes into new rows of the same table, so the payload selectors on them (checkout/webhooks/calculate_taxes.py:40, order/webhooks/order_calculate_taxes.py:119, order/notifications.py:243/252) and the format_address template helper (plugins/email_common.py:127) read the same column. Ruling (2026-10-01): the stored column decides; rows copied within one column are not a separate item, unlike a copy into a different column or table (medusa''s order_address).'
