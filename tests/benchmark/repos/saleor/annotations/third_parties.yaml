version: third-party-labels/1
scope_note: Account, checkout, order, gift card, the email plugins and core notifications; only the SendGrid plugin reaches a vendor. SMTP in the email plugins and webhook apps are admin-configured, and boto3, sentry-sdk and storage SDKs are used outside the scope.
vendors:
- vendor: sendgrid
  subject_key: third_party:sendgrid
  component_subtype: email_provider
  sends_data: true
  route: sdk
  subprocessor: "yes"
  data_categories: [email, person_name, address, phone_number, user_id, access_token, order, transaction]
  provenance:
    manifest:
    - {file_path: pyproject.toml, line: 62, package: sendgrid}
    - {file_path: pyproject.toml, line: 54, package: python-http-client}
    imports:
    - {file_path: saleor/plugins/sendgrid/tasks.py, line: 3, module: python_http_client}
    - {file_path: saleor/plugins/sendgrid/tasks.py, line: 4, module: sendgrid}
    - {file_path: saleor/plugins/sendgrid/tasks.py, line: 5, module: sendgrid.helpers.mail}
    call_sites:
    - {file_path: saleor/plugins/sendgrid/tasks.py, line: 30}
  uncertain: false
  rationale: send_email builds a SendGridAPIClient with the configured API key and sends a Mail to the recipient with the
    whole notification payload as dynamic template data, which carries user details, password-reset and confirmation tokens,
    and order data with addresses, phone numbers and payments.
  review_state: proposed
  proposed_by: claude-opus-5.5
  proposed_at: '2026-11-12'
