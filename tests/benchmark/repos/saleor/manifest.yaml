selection_rationale: A complete, authored Django account model with names, full postal addresses, phones, account email, profile image, authentication key, free-text notes, and realistic operational metadata. Widened (KDATAP-25ff9a) from saleor/account/models.py alone to the account, checkout, order, and gift card apps, the admin and customer email plugins, SendGrid, and core notifications, so email labeling covers several distinct addresses (customer account, checkout and order recipient, staff, sender configuration) and realistic non-value uses of the word.
