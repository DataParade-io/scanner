name: Baseline corpus

on:
  workflow_dispatch:
    inputs:
      repo_keys:
        description: Optional comma-separated repo keys (default all 29 packets)
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 0"
  workflow_call:

concurrency:
  group: baseline-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Materialize benchmark packets
        run: |
          if [ -n "${{ github.event.inputs.repo_keys }}" ]; then
            IFS=',' read -ra KEYS <<< "${{ github.event.inputs.repo_keys }}"
            for key in "${KEYS[@]}"; do
              trimmed="$(echo "$key" | xargs)"
              if [ -n "$trimmed" ]; then
                pnpm run benchmark:materialize -- "$trimmed"
              fi
            done
          else
            pnpm run benchmark:materialize -- --all
          fi

      - name: Validate materializations
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.repo_keys == '' }}
        run: pnpm run benchmark:validate-materializations

      - name: Upload materialization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialization-validation
          path: tests/benchmark/reports/materialization-validation.json
          if-no-files-found: ignore
