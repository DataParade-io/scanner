# Closed one-to-one map: detector rule id → canonical concept leaf (KDATAP-326fdd).
# Separate from the scanner capability manifest — do not merge with adapterMapVersion.
# Map version bumps on semantic remap; CANONICAL_CONTRACT_VERSION bumps only when
# canonicalization meaning changes beyond this artifact.
version: "1.0.0"
personal_data_concept_map:
