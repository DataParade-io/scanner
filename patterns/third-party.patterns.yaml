# url_routes: hosts that serve several products. Rules run in order; the first rule whose
# `path` (URL path, no query) and `hint` (file path, class, function and URL expression of
# the calling code) both match names the service. A rule's subType overrides the catalog one.
url_routes:
  - host: graph.facebook.com
    rules:
      # Conversions API: POST /{pixel_id}/events.
      - path: "/events/?$"
        serviceName: meta_conversions_api
      # Instagram content publishing: /{ig_user_id}/media and /media_publish.
      - path: "/media(_publish)?/?$"
        serviceName: instagram
        subType: saas_service
      # WhatsApp Cloud API calls go through the Graph host with a phone number id.
      - hint: "whatsapp|phone_number_id|(^|[^a-z])wa_"
        serviceName: whatsapp
      - path: "/messages/?$"
        hint: "instagram|(^|[^a-z])ig_"
        serviceName: instagram
        subType: messaging
      - path: "/messages/?$"
        serviceName: facebook_messenger
      - serviceName: facebook_graph

# url_path_routes: URLs whose host is only known at runtime (`https://{self.domain}/api/mcp`).
# A rule names the service when the URL path matches `path` and the calling code or the
# class/module the URL was built in matches `hint`. Both are required: a path alone is
# too weak to name a vendor.
url_path_routes:
  # Shopify Storefront MCP: every shop serves it at https://{shop}/api/mcp; the host is the
  # merchant's domain, so only Shopify-named code (ShopifyStore, shopify_store.py) counts.
  - path: "^/api/mcp/?$"
    hint: "shopify"
    serviceName: shopify

# llm_model_prefixes: LiteLLM routes `provider/model` to the provider. Only providers in the
# classifier catalog are listed.
llm_model_prefixes:
  groq: groq
  together_ai: together_ai
  openrouter: openrouter
  cerebras: cerebras
  anthropic: anthropic
  openai: openai
  gemini: google_ai
  vertex_ai: google_ai
  bedrock: aws
  sagemaker: aws
  azure: azure
