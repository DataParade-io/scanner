---
# Shared third-party detection config for external API calls / SDKs.
# Language-agnostic structure; TS/JS analyzer is the first consumer.
#
# This file defines *how* to recognize external API calls and known services
# (Stripe, SendGrid, Twilio, etc.). The classifier then uses
# classifier/third-party.classifier.yaml to map serviceName → third_party components.

http_clients:
  - clientId: fetch_axios_got
    patternId: external_api_call
    regexes:
      - "\\b(fetch|axios\\.(get|post|put|delete|patch)|got)\\s*\\(\\s*[\"'`](https?:\\/\\/[^\"'`]+)[\"'`]"
    confidence: 0.9
  # Literal https URL in object config (e.g. axios({ url: "https://api.vendor/..." })).
  - clientId: object_url_literal_https
    patternId: external_api_call
    regexes:
      - "\\b(url)()\\s*:\\s*[\"'`](https?:\\/\\/[^\"'`]+)[\"'`]"
    confidence: 0.8

# url_host_patterns: optional overrides when the auto-derived registrable host
# (last two DNS labels) is not the canonical catalog key — e.g. api.stripe.com → stripe.
# Unknown vendors do not need entries: detection falls back to hostname-based keys.
services:
  - serviceName: stripe
    patternId: external_api_call
    importFragments:
      - stripe
      - stripe/stripe-php
    confidence: 0.85
    url_host_patterns:
      - stripe.com
      - api.stripe.com
