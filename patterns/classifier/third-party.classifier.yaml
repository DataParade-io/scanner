---
# Known third-party services used by the CLI classifier.
# DP-P0-CLI-202 – dedicated catalog for third_party components.

third_parties:
  # Payment processors.
  - serviceName: stripe
    matchKeys:
      - stripe
    type: third_party
    subType: payment_processor

  - serviceName: braintree
    matchKeys:
      - braintree
      - "api.braintreepayments.com"
    type: third_party
    subType: payment_processor

  - serviceName: adyen
    matchKeys:
      - adyen
      - "checkout.adyen.com"
    type: third_party
    subType: payment_processor

  - serviceName: paypal
    matchKeys:
      - paypal
      - "api.paypal.com"
      - "paypalobjects.com"
    type: third_party
    subType: payment_processor

  # Email/SaaS providers.
  - serviceName: sendgrid
    matchKeys:
      - sendgrid
    type: third_party
    subType: saas_service

  - serviceName: twilio
    matchKeys:
      - twilio
    type: third_party
    subType: saas_service

  - serviceName: twitter
    matchKeys:
      - twitter
      - "api.twitter.com"
      - "api.x.com"
    type: third_party
    subType: saas_service

  - serviceName: notion
    matchKeys:
      - "@notionhq/client"
      - "notion.so"
      - "notion.com"
    type: third_party
    subType: saas_service

  - serviceName: google_identity
    matchKeys:
      - google_identity
      - googleauth
      - google-api-client
      - "accounts.google.com"
      - "oauth2.googleapis.com"
    type: third_party
    subType: saas_service

  - serviceName: firebase
    matchKeys:
      - firebase
    type: third_party
    subType: saas_service

  # Database / BaaS platforms.
  - serviceName: supabase
    matchKeys:
      - supabase
      - "supabase.co"
      - "supabase.com"
    type: third_party
    subType: saas_service

  # API / AI providers.
  - serviceName: openai
    matchKeys:
      - openai
    type: third_party
    subType: ai_provider

  - serviceName: anthropic
    matchKeys:
      - anthropic
      - "@anthropic-ai/"
      - "api.anthropic.com"
    type: third_party
    subType: ai_provider

  - serviceName: openrouter
    matchKeys:
      - openrouter
      - "@openrouter/"
      - openrouter.ai
      - openrouter.com
    type: third_party
    subType: ai_provider

  - serviceName: google_ai
    matchKeys:
      - google_ai
      - "generativelanguage.googleapis.com"
      - "@google-cloud/vertexai"
      - vertexai
    type: third_party
    subType: ai_provider

  - serviceName: clipdrop
    matchKeys:
      - clipdrop
      - clipdrop-api.co
    type: third_party
    subType: ai_provider

  - serviceName: thenextleg
    matchKeys:
      - thenextleg
      - thenextleg.io
    type: third_party
    subType: ai_provider

  - serviceName: vectorizer
    matchKeys:
      - vectorizer
      - vectorizer.ai
    type: third_party
    subType: ai_provider

  # Cloud providers.
  - serviceName: aws
    matchKeys:
      - aws
      - "@aws-sdk/"
    type: third_party
    subType: cloud_provider

  - serviceName: gcp
    matchKeys:
      - gcp
      - "@google-cloud/"
      - google-cloud
    type: third_party
    subType: cloud_provider

  - serviceName: azure
    matchKeys:
      - azure
      - "@azure/"
    type: third_party
    subType: cloud_provider

  # Auth & identity providers.
  - serviceName: google_auth
    matchKeys:
      - "accounts.google.com"
      - "oauth2.googleapis.com"
      - "www.googleapis.com/oauth2"
      - "google-auth-library"
      - "google_auth_oauthlib"
      - "@react-oauth/google"
      - "googleapis"
    type: third_party
    subType: saas_service

  - serviceName: auth0
    matchKeys:
      - auth0
      - "auth0.com"
      - "AUTH0_"
    type: third_party
    subType: saas_service

  # Error monitoring / observability.
  - serviceName: sentry
    matchKeys:
      - sentry
      - "sentry.io"
      - "sentry_sdk"
    type: third_party
    subType: saas_service

  # Raw-HTTP destinations (DATAP-818). Python request calls name these services from the
  # resolved URL host; url_routes in third-party.patterns.yaml split graph.facebook.com.
  - serviceName: x
    matchKeys:
      - "api.x.com"
    type: third_party
    subType: saas_service

  - serviceName: whatsapp
    matchKeys:
      - whatsapp
    type: third_party
    subType: messaging

  - serviceName: facebook_messenger
    matchKeys:
      - facebook_messenger
    type: third_party
    subType: messaging

  - serviceName: facebook_graph
    matchKeys:
      - "graph.facebook.com"
    type: third_party
    subType: saas_service

  - serviceName: meta_conversions_api
    matchKeys:
      - meta_conversions_api
    type: third_party
    subType: analytics

  - serviceName: instagram
    matchKeys:
      - "graph.instagram.com"
    type: third_party
    subType: saas_service

  - serviceName: linkedin
    matchKeys:
      - "api.linkedin.com"
    type: third_party
    subType: saas_service

  - serviceName: reddit
    matchKeys:
      - "reddit.com"
    type: third_party
    subType: saas_service

  - serviceName: crisp
    matchKeys:
      - "api.crisp.chat"
    type: third_party
    subType: messaging

  - serviceName: telegram
    matchKeys:
      - "api.telegram.org"
    type: third_party
    subType: messaging

  - serviceName: google_analytics
    matchKeys:
      - "google-analytics.com"
    type: third_party
    subType: analytics

  - serviceName: make
    matchKeys:
      - ".make.com"
    type: third_party
    subType: saas_service

  - serviceName: shopify
    matchKeys:
      - "myshopify.com"
    type: third_party
    subType: saas_service

  - serviceName: cerebras
    matchKeys:
      - "api.cerebras.ai"
    type: third_party
    subType: ai_provider

  - serviceName: arize_phoenix
    matchKeys:
      - "phoenix.arize.com"
    type: third_party
    subType: monitoring
