# Ruby / Rails pattern config. patternId values must exist in components.classifier.yaml.
#
# Line-based rules use filePathRegex + contentRegex on stripped source.
# database_yml rules also apply when ingest language is yaml (see ruby detector).
# ActiveRecord classes are domain evidence, not architecture components.

database_yml:
  patternId: database_connection
  filePathRegex: "(?:^|/)config/database\\.ya?ml(?:\\.example)?$"
  adapterRegex: "^\\s*adapter:\\s*(\\w+)"
  databaseNameRegex: "^\\s*database:\\s*([\\w_-]+)"
  confidence: 0.9
  drivers:
    postgresql: postgres
    postgres: postgres
    mysql2: mysql
    mysql: mysql
    sqlite3: sqlite
    sqlite: sqlite

routes:
  frameworks:
    - id: rails
      patternId: express_route
      filePathRegex: "(?:^|/)config/routes\\.rb$"
      confidence: 0.9
      routeRegexes:
        - regex: "\\b(get|post|put|patch|delete|options|match)\\s+[\"']([^\"']+)[\"']"
          methodGroup: 1
          pathGroup: 2
          routeKind: verb
        - regex: "\\bresources\\s+:([A-Za-z_]\\w*)"
          pathGroup: 1
          routeKind: resources
        - regex: "\\bresources\\s+[\"']([^\"']+)[\"']"
          pathGroup: 1
          routeKind: resources
        - regex: "\\bresource\\s+:([A-Za-z_]\\w*)"
          pathGroup: 1
          routeKind: resource
        - regex: "\\bresource\\s+[\"']([^\"']+)[\"']"
          pathGroup: 1
          routeKind: resource
        - regex: "\\bnamespace\\s+:([A-Za-z_]\\w*)"
          pathGroup: 1
          routeKind: namespace
        - regex: "\\bnamespace\\s+[\"']([^\"']+)[\"']"
          pathGroup: 1
          routeKind: namespace
        - regex: "\\bscope(?:\\s+path:)?\\s*[\"']([^\"']+)[\"']"
          pathGroup: 1
          routeKind: scope
        - regex: "^\\s*member\\s+do\\b"
          routeKind: member
        - regex: "^\\s*collection\\s+do\\b"
          routeKind: collection
        - regex: "\\bmount\\s+.+?=>\\s*[\"']([^\"']+)[\"']"
          pathGroup: 1
          routeKind: mount

auth:
  libraries:
    - id: rails_session_store
      patternId: auth_middleware
      filePathRegex: "(?:^|/)config/initializers/.*session"
      contentRegexes:
        - "\\bsession_store\\b"
      strategy: session_cookie
      confidence: 0.9

    - id: has_secure_password
      patternId: auth_middleware
      contentRegexes:
        - "\\bhas_secure_password\\b"
      strategy: bcrypt
      confidence: 0.85

    - id: bcrypt
      patternId: auth_middleware
      contentRegexes:
        - "\\bBCrypt::"
        - "\\bpassword_digest\\b"
      strategy: bcrypt
      confidence: 0.85

    - id: devise
      patternId: auth_middleware
      contentRegexes:
        - "\\bdevise\\s+:[A-Za-z_]"
        - "\\bauthenticate_[A-Za-z_]\\w*!?\\b"
        - "\\bDevise\\."
      strategy: devise
      confidence: 0.9

    - id: warden
      patternId: auth_middleware
      contentRegexes:
        - "\\bWarden::"
        - "\\b(?:request\\.)?env\\[[\"']warden[\"']\\]"
      strategy: warden
      confidence: 0.9

    - id: omniauth
      patternId: auth_middleware
      contentRegexes:
        - "\\bOmniAuth(?:\\.|::)"
        - "\\bomniauth\\b"
      strategy: oauth
      confidence: 0.9

    - id: jwt
      patternId: auth_middleware
      contentRegexes:
        - "\\bJWT\\.(?:encode|decode)\\b"
        - "\\brequire\\s+[\"']jwt[\"']"
      strategy: jwt
      confidence: 0.9

    - id: rails_session
      patternId: auth_middleware
      contentRegexes:
        - "\\bsession\\s*\\[[^\\]]+\\]"
        - "\\breset_session\\b"
      strategy: session
      confidence: 0.85

    - id: api_key
      patternId: auth_middleware
      contentRegexes:
        - '["''](?:X-API-Key|HTTP_X_API_KEY)["'']'
        - "\\bheaders\\[[\"']Authorization[\"']\\].*\\bApi-Key\\b"
      strategy: api_key
      confidence: 0.9

cache:
  clients:
    - id: redis_initializer
      patternId: database_connection
      databaseType: redis
      componentSubType: cache
      filePathRegex: "(?:^|/)config/initializers/.*redis"
      contentRegexes:
        - "\\bRedis\\.new\\b"
        - "\\bDiscourse\\.redis\\b"
        - "\\bredis\\.ping\\b"
        - "\\bREDIS\\b"
      confidence: 0.9

    - id: rails_cache_store
      patternId: database_connection
      databaseType: redis
      componentSubType: cache
      contentRegexes:
        - "\\bconfig\\.cache_store\\s*=\\s*:redis"
        - "\\b:redis_cache_store\\b"
      confidence: 0.85

external_apis:
  httpClients:
    - id: net_http
      patternId: external_api_call
      clientName: net_http
      contentRegexes:
        - "\\bNet::HTTP(?:\\.(?:get|post|put|patch|delete|request|start)|::(?:Get|Post|Put|Patch|Delete)\\b)"
      confidence: 0.9

    - id: httparty
      patternId: external_api_call
      clientName: httparty
      contentRegexes:
        - "\\bHTTParty\\.(?:get|post|put|patch|delete|head|options)\\b"
      confidence: 0.9

    - id: faraday
      patternId: external_api_call
      clientName: faraday
      contentRegexes:
        - "\\bFaraday(?:\\.(?:get|post|put|patch|delete|head|new)|::Connection\\.new)\\b"
      confidence: 0.9

    - id: rest_client
      patternId: external_api_call
      clientName: rest_client
      contentRegexes:
        - "\\bRestClient\\.(?:get|post|put|patch|delete|head|options|execute)\\b"
      confidence: 0.9

services: []
